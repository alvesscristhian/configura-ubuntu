# ---- fonte ----
# JetBrainsMono Nerd Font nao esta instalada neste sistema.
# Usando Ubuntu Sans Mono (existe aqui).
font_family      Ubuntu Sans Mono
font_size        12.0

# ---- janela ----
window_padding_width 8
hide_window_decorations no
confirm_os_window_close 0

# ---- scrollback / cursor ----
scrollback_lines 10000
cursor_shape beam

# ---- foto de fundo ----
# PNG convertido de "WhatsApp Image 2026-07-29 at 13.36.12.jpeg"
# Foto em pe (720x1280): "centered" mostra ela inteira, nitida, numa faixa
# vertical no meio. Troque por "cscaled" para preencher toda a janela
# (corta ~65% da altura e amplia 2,7x, ficando borrado).
background_image /home/cristhian/.config/kitty/background.png
background_image_layout centered
background_image_linear yes
background_tint 0.90
background_tint_gaps 1.0

# opcional: transparencia da janela inteira
# background_opacity 0.95
